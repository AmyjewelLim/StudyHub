<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="stylesheets/index.css">
</head>
<body>

<h2>Login</h2>

<form action="/action_page.php" method="post" class="container">
  <label for="uname"><b>Username</b></label>
  <input type="text" placeholder="Enter Username" name="uname" required>

  <label for="psw"><b>Password</b></label>
  <input type="password" placeholder="Enter Password" name="psw" required>

  <label>
    <input type="checkbox" checked="checked" name="remember"> Remember me
  </label>

  <button type="submit">Login</button>
  <p style="margin-top: 12px; text-align: center;">Don't have an account? <a href="index.html" style="color: #04AA6D;">Sign up here</a>.</p>
  <span class="psw">Forgot <a href="forgotpassword.html">password?</a></span>
</form>

</body>
</html>
